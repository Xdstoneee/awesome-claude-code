[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blewatch"
version = "0.1.0"
description = "CLI daemon for detecting BLE stalker trackers (AirTag, Tile, SmartTag, unknown)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.1",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
pcap = [
    "scapy>=2.5.0",
]

[project.scripts]
blewatch = "blewatch.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
